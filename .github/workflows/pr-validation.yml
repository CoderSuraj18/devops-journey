name: Pull Request Validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required website files
        run: |
          test -s index.html
          test -s style.css

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
